# Caddy container for a Linux Docker server (Ubuntu). Uses host networking so the
# container reaches every upstream on 127.0.0.1 — Go apps, static/Node dev
# servers, shared-WP fpm, shared MariaDB, adminer all bind 127.0.0.1, which a
# *bridged* container cannot reach on Linux (unlike podman/gvproxy on macOS).
# Host networking makes Caddy behave exactly like the native binary.
#
#   export XDEV_DATA=/var/lib/xdev            # same as xdev.env
#   docker compose -f deploy/caddy/docker-compose.linux.yml up -d
#
# Listen ports are NOT set here — xdev pushes them from XDEV_HTTP_PORT /
# XDEV_HTTPS_PORT, so you change 8081/8444 -> 80/443 in xdev.env alone.
#
# xdev.env for this setup:
#   XDEV_CADDY=false                     # Caddy is this container, not supervised
#   XDEV_UPSTREAM_HOST=127.0.0.1         # host networking => plain loopback, no rewrite
#   XDEV_CADDY_ADMIN_LISTEN=127.0.0.1:2019  # re-assert loopback admin on every push (no churn, not exposed)
#   XDEV_HTTP_PORT=8081                  # migration phase behind Traefik; 80 once switched
#   XDEV_HTTPS_PORT=8444                 # migration phase behind Traefik; 443 once switched
services:
  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    # Default admin is 127.0.0.1:2019 (loopback) — correct and unexposed under
    # host networking; xdev re-asserts it on each push. No init config needed.
    command: ["caddy", "run"]
    volumes:
      # Local CA / issued certs, shared with xdev (image sets XDG_DATA_HOME=/data).
      # ${XDEV_DATA:?...} makes compose abort if it's unset, instead of mounting
      # empty root-owned /caddy and /wp (no CA, WP 404s).
      - "${XDEV_DATA:?set XDEV_DATA to xdev's data dir, e.g. /var/lib/xdev}/caddy:/data/caddy"
      # Shared-WP tree at the same absolute path so file_server + fpm resolve.
      - "${XDEV_DATA:?set XDEV_DATA}/wp:${XDEV_DATA:?set XDEV_DATA}/wp:ro"
