{{define "tw_source"}}<style type="text/tailwindcss">
/* xdev design system — authored as a Tailwind v4 source, compiled in-browser by
   the vendored @tailwindcss/browser build (inlined as <style type="text/tailwindcss">).
   @theme exposes the Nova palette as utilities (bg-accent, text-muted, …); the
   component classes below keep the templates readable. No build step. */
@import "tailwindcss";

@theme {
  --color-bg: #0d0b12;
  --color-chrome: #ffffff05;
  --color-panel: #ffffff06;
  --color-panel-2: #ffffff0a;
  --color-text: #eceaf2;
  --color-muted: #96909f;
  --color-accent: #b48cff;
  --color-accent-ink: #161022;
  --color-ok: #8ce8b8;
  --color-off: #96909f;
  --color-danger: #f58c8c;
  --color-warn: #f2c14e;
}

:root {
  --bg: #0d0b12;
  --code-bg: #08060c;
  --panel: rgba(255, 255, 255, 0.025);
  --panel-2: rgba(255, 255, 255, 0.04);
  --chrome: rgba(255, 255, 255, 0.02);
  --border: rgba(255, 255, 255, 0.08);
  --border-soft: rgba(255, 255, 255, 0.06);
  --border-card: rgba(255, 255, 255, 0.07);
  --text: #eceaf2;
  --muted: #96909f;
  --accent: #b48cff;
  --accent-ink: #161022;
  --ok: #8ce8b8;
  --off: #96909f;
  --danger: #f58c8c;
  --warn: #f2c14e;
  --radius: 10px;
  --radius-sm: 8px;
  /* Spacing scale. Every gap on a page comes from one of these four, so cards,
     form rows and stacked sections line up without each template picking its
     own number — the drift between them was what made dense pages read as
     cluttered rather than as one layout. */
  --gap: 18px;      /* between cards, and between the columns of a page grid */
  --gap-sm: 10px;   /* between controls that belong to one another */
  --field: 16px;    /* above a form field's label */
  --pad-card: 22px 24px;
  --ring: 0 0 0 3px rgba(180, 140, 255, 0.25);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 24px -12px rgba(0, 0, 0, 0.55);
}

body {
  margin: 0;
  background:
    radial-gradient(1000px 500px at 20% -10%, rgba(180, 140, 255, 0.08), transparent 60%),
    var(--bg);
  color: var(--text);
  font: 14.5px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  /* Reserve the scrollbar so locking body scroll for a modal doesn't shift the
     page sideways underneath it. */
  scrollbar-gutter: stable;
}

::selection { background: rgba(180, 140, 255, 0.35); }
[x-cloak] { display: none !important; }

.muted { color: var(--muted); }
.small { font-size: 12.5px; }

/* Top bar */
.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 28px;
  padding: 0 44px;
  height: 64px;
  border-bottom: 1px solid var(--border-card);
  background: var(--chrome);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 16.5px;
  letter-spacing: -0.01em;
  color: var(--text);
}
.brand::before {
  content: "";
  width: 22px;
  height: 22px;
  border-radius: 50%;
  flex: none;
  background: conic-gradient(from 210deg, var(--accent), #6e4bc4 55%, var(--accent));
  box-shadow: inset 0 0 0 8px var(--bg);
}
.topnav { display: flex; align-items: center; gap: 4px; flex: 1; }
.topnav a.navlink {
  color: var(--muted);
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 500;
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  transition: color 0.15s, background 0.15s;
}
.topnav a.navlink:hover { color: var(--text); }
.topnav a.navlink.active {
  color: var(--accent);
  background: rgba(180, 140, 255, 0.12);
  font-weight: 600;
}
.topnav .muted { font-size: 13px; }
.inline { display: inline; margin: 0; }
/* Topbar identity + chrome controls: grouped, evenly spaced, set off from the
   search box on their left. */
.topbar-actions { display: flex; align-items: center; gap: 8px; margin-left: 18px; }
/* Flex filler used by topnav, chart/table heads, and app-card-head rows to
   push trailing controls to the right edge. */
.spacer { flex: 1; }

.container { max-width: 1180px; margin: 0 auto; padding: 38px 52px 64px; }
@media (max-width: 900px) {
  .container { padding: 28px 20px 48px; }
  .topbar { padding: 0 20px; }
}

/* Cards */
.card {
  background: var(--panel);
  border: 1px solid var(--border-card);
  border-radius: var(--radius);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  padding: var(--pad-card);
  margin-bottom: var(--gap);
  box-shadow: var(--shadow);
}
/* A card's own padding is its outer spacing — the first and last things inside
   must not add to it. Without this every card's top gap depends on whether it
   happens to start with a heading, a label or a paragraph. */
.card > :first-child { margin-top: 0; }
.card > :last-child { margin-bottom: 0; }

/* Headings */
h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
h2 { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 6px; }
h3 {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin: 0 0 14px;
}

.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 26px;
}

/* Forms */
label { display: block; margin: var(--field) 0 6px; font-size: 12.5px; font-weight: 600; }
label .muted { font-weight: 400; }
/* The hint under a field belongs to the field above it, not to the next one. */
label + p.muted, input + p.muted, select + p.muted, textarea + p.muted { margin: 6px 0 0; }
/* Every textarea, not only .code: the read-only ones holding a deploy key or a
   webhook secret are exactly the ones that must not be a 20-column box you have
   to scroll sideways to read. */
input, select, textarea {
  width: 100%;
  padding: 9px 13px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 14px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
input::placeholder { color: #6b6577; }
/* File inputs size to content so they sit inline with their upload button
   instead of stretching full-width and wrapping the button below. */
input[type="file"] { width: auto; }
textarea { font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; resize: vertical; }
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: var(--ring);
}

button {
  cursor: pointer;
  white-space: nowrap;
  font-size: 13.5px;
  font-weight: 600;
  border-radius: var(--radius-sm);
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: transparent;
  color: var(--text);
  padding: 9px 16px;
  transition: background 0.15s, border-color 0.15s, transform 0.05s;
}
button:hover { background: rgba(255, 255, 255, 0.04); border-color: rgba(255, 255, 255, 0.22); }
button:active { transform: translateY(1px); }
button:focus-visible { outline: none; box-shadow: var(--ring); }
button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-weight: 700;
  box-shadow: 0 6px 20px rgba(180, 140, 255, 0.28);
}
button.primary:hover { background: #c3a3ff; border-color: #c3a3ff; }
button.primary[disabled] { opacity: 0.5; cursor: not-allowed; }
button.link { background: none; border: none; color: var(--muted); padding: 0; box-shadow: none; }
button.link:hover { color: var(--text); background: none; }

/* Busy state: while a form POST is in flight the submit button hides its label
   (kept in flow so the button doesn't collapse) and shows a centered spinner;
   the page reload on completion clears the class. */
button.is-busy { color: transparent; position: relative; pointer-events: none; }
button.is-busy::after {
  content: ""; position: absolute; top: 50%; left: 50%;
  width: 14px; height: 14px; margin: -7px 0 0 -7px;
  border: 2px solid var(--text); border-right-color: transparent;
  border-radius: 50%; animation: btnspin 0.6s linear infinite;
}
button.primary.is-busy::after { border-color: var(--accent-ink); border-right-color: transparent; }
@keyframes btnspin { to { transform: rotate(360deg); } }

/* Anchors styled as buttons */
a.btn, a.primary {
  text-decoration: none;
  display: inline-block;
  padding: 9px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: transparent;
  color: var(--text);
  font-size: 13.5px;
  font-weight: 600;
  transition: background 0.15s, border-color 0.15s;
}
a.btn:hover { background: rgba(255, 255, 255, 0.04); border-color: rgba(255, 255, 255, 0.22); }
a.primary.btn, a.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-weight: 700;
  box-shadow: 0 6px 20px rgba(180, 140, 255, 0.28);
}
a.primary.btn:hover, a.primary:hover { background: #c3a3ff; border-color: #c3a3ff; }

/* Danger buttons */
button.danger, .btn.danger {
  background: rgba(245, 140, 140, 0.05);
  border-color: rgba(245, 140, 140, 0.3);
  color: var(--danger);
}
button.danger:hover { background: rgba(245, 140, 140, 0.12); border-color: rgba(245, 140, 140, 0.45); }

/* Auth pages */
.auth-card { max-width: 380px; margin: 10vh auto 0; padding: 30px; }
.auth-card h1 { font-size: 20px; margin-bottom: 4px; }
.auth-card button { width: 100%; margin-top: 20px; padding: 11px 14px; }

/* Alerts */
.alert {
  background: rgba(245, 140, 140, 0.06);
  border: 1px solid rgba(245, 140, 140, 0.3);
  color: var(--danger);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 12px;
  font-size: 13.5px;
}
.alert.ok {
  background: rgba(140, 232, 184, 0.07);
  border-color: rgba(140, 232, 184, 0.3);
  color: var(--ok);
}
/* An in-dialog failure: engine output keeps its line breaks, and a long one
   scrolls inside the panel instead of pushing the submit button off-screen. */
.alert.form-error {
  margin: 12px 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 180px;
  overflow-y: auto;
}
.alert.warn-banner {
  background: rgba(242, 193, 78, 0.07);
  border-color: rgba(242, 193, 78, 0.25);
  color: #f2c14e;
}

/* Runtime status — engines stacked (podman above docker), not side by side. */
.runtime-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
.runtime {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 12px 14px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
}
.runtime .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); flex: none; }
.runtime.ok .dot { background: var(--ok); box-shadow: 0 0 8px rgba(140, 232, 184, 0.6); }
.runtime .grow { flex: 1; min-width: 0; }
.up { color: var(--ok); }
.down { color: var(--danger); }
.tag {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  background: rgba(180, 140, 255, 0.13);
  color: var(--accent);
  border: 1px solid rgba(180, 140, 255, 0.3);
  padding: 1px 7px;
  border-radius: 20px;
  margin-left: 6px;
  vertical-align: 1px;
}

/* Projects */
.project { display: flex; align-items: center; justify-content: space-between; }
.badge {
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 3px 12px;
  font-size: 12px;
  color: var(--muted);
}
.empty { text-align: center; padding: 48px 24px; }

/* Card-as-link (project cards) */
a.card { text-decoration: none; color: inherit; transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s; }
a.card.project-card:hover {
  border-color: rgba(180, 140, 255, 0.35);
  transform: translateY(-1px);
  box-shadow: 0 4px 16px -4px rgba(0, 0, 0, 0.5);
}

/* Breadcrumbs */
.crumbs { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }

/* Forms layout */
.form-card { max-width: 560px; }
/* Inside a page grid a card is already as wide as its column; the 560px cap is
   for full-width pages, and applying it in a column would leave a ragged edge. */
.grid-main .form-card, .side-col .form-card { max-width: none; }
.form-card button.primary, .form-card a.btn { margin-top: 20px; }
.form-actions { display: flex; gap: 10px; align-items: center; margin-top: 20px; }
.form-actions button.primary, .form-actions a.btn { margin-top: 0; }
code {
  background: var(--panel-2);
  border: 1px solid var(--border-soft);
  padding: 1px 6px;
  border-radius: 6px;
  font-size: 0.9em;
}
.mt { margin-top: 32px; }

/* App rows */
.app { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.app-main { display: flex; align-items: center; gap: 14px; min-width: 0; }
.app-actions { display: flex; gap: 6px; align-items: center; flex: none; }
.app-actions .inline button { padding: 6px 14px; font-size: 12.5px; }
.status { width: 8px; height: 8px; border-radius: 50%; background: transparent; border: 1.5px solid var(--off); box-sizing: border-box; flex: none; align-self: flex-start; margin-top: 7px; }
.status.running { background: var(--ok); border-color: var(--ok); box-shadow: 0 0 8px rgba(140, 232, 184, 0.6); }
.status.error { background: var(--danger); border-color: var(--danger); box-shadow: 0 0 8px rgba(245, 140, 140, 0.7); }
.status.stopped { background: transparent; border-color: var(--off); }

/* Host resource bars */
.host-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 26px; }
.host-label { font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 9px; }
.bar {
  height: 6px;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 99px;
  overflow: hidden;
  margin-bottom: 6px;
}
.bar > span {
  display: block;
  height: 100%;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.4s ease;
}
.bar.warn > span { background: var(--warn); }

/* Two-column form row */
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.row2 label { margin-top: 14px; }

/* uPlot charts adopt the dark theme */
.uplot, .u-legend { color: var(--muted); font-size: 12px; }

/* Deploy steps — one collapsed row per command a deploy ran, so a build reads
   as a list rather than a wall of output. */
.steps { margin-top: 6px; border: 1px solid var(--border-card); border-radius: var(--radius-sm); overflow: hidden; }
.steps .step + .step { border-top: 1px solid var(--border-card); }
.steps .step > summary {
  cursor: pointer; padding: 6px 10px; display: flex; align-items: center; gap: 8px;
  list-style: none;
}
.steps .step > summary::-webkit-details-marker { display: none; }
.steps .step > summary:hover { background: var(--code-bg); }
.steps .step-failed > summary { color: var(--danger, #ff6b6b); }
.steps .step > pre.logs { border: 0; border-radius: 0; max-height: 40vh; margin: 0; }

/* Logs + code editor */
pre.logs {
  background: var(--code-bg);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-sm);
  padding: 16px;
  overflow: auto;
  max-height: 70vh;
  font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
  color: #d6d0dc;
  white-space: pre-wrap;
  word-break: break-word;
}
textarea.code {
  background: var(--code-bg);
  color: #d6d0dc;
  padding: 14px;
  font: 13px/1.6 ui-monospace, Menlo, monospace;
  resize: vertical;
}

/* Tables (backups, events) */
.table { width: 100%; border-collapse: collapse; }
.table th {
  padding: 8px 14px;
  text-align: left;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  border-bottom: 1px solid var(--border-soft);
}
.table td { padding: 12px 14px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
.table tr:last-child td { border-bottom: none; }
/* First/last cells shed their outer padding so the first column lines up with
   the card title and the last (action) column with the header's controls. */
.table th:first-child, .table td:first-child { padding-left: 0; }
.table th:last-child, .table td:last-child { padding-right: 0; }
.table .right { text-align: right; }
.nowrap { white-space: nowrap; }

/* Audit level pills */
.lvl {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 2px 8px;
  border-radius: 20px;
}
.lvl.info { background: rgba(180, 140, 255, 0.12); color: var(--accent); }
.lvl.warn { background: rgba(242, 193, 78, 0.12); color: var(--warn); }
.lvl.error { background: rgba(245, 140, 140, 0.12); color: var(--danger); }

/* Warning banner extras (hosts hint) */
.hosts-lines {
  background: var(--code-bg);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  margin: 10px 0;
  color: #d6d0dc;
  font: 12.5px/1.6 ui-monospace, Menlo, monospace;
  overflow-x: auto;
}
.trust-hint { margin: -8px 0 20px; }

/* Small link-button (the per-app Settings link in a card's tab bar) */
a.btn.small { padding: 5px 11px; font-size: 12.5px; margin-top: 0; }

/* Read-only facts on the settings page: what an app *is*, beside what it can be
   changed to. */
.fact-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 12px;
  margin: 4px 0 12px;
  padding: 12px;
  background: var(--panel);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
  font-size: 13.5px;
}

@media (max-width: 560px) {
  .runtime-grid, .host-grid, .row2 { grid-template-columns: 1fr; }
}

/* ---- Sidebar: fixed slide-in drawer (nav switch is client-side, no reload) ---- */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 40;
  width: 220px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 22px 16px;
  border-right: 1px solid var(--border-card);
  background: var(--chrome);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  overflow-y: auto;
}
.sidebar .brand { padding: 4px 10px 20px; }
.sidenav { display: flex; flex-direction: column; gap: 2px; }
.sidenav a.navlink {
  color: var(--text);
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 500;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  transition: color 0.15s, background 0.15s;
}
.sidenav a.navlink:hover { background: rgba(255, 255, 255, 0.04); }
.sidenav a.navlink.active { color: var(--accent); background: rgba(180, 140, 255, 0.12); font-weight: 600; }
.sidenav-foot { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; margin-top: 4px; }

.engine-mini, .user-mini {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border-soft);
  margin-top: 4px;
}
.engine-mini .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--off); flex: none; }
.engine-mini .dot.ok { background: var(--ok); }

.avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
  background: linear-gradient(135deg, #39304d, #221c30);
  border: 1px solid rgba(180, 140, 255, 0.3);
}

/* Topbar search box + live results dropdown */
.searchbox-wrap { position: relative; }
.searchbox {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 13px;
  border-radius: var(--radius-sm);
  background: var(--panel-2);
  border: 1px solid var(--border);
  width: 240px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.searchbox:focus-within { border-color: var(--accent); box-shadow: var(--ring); }
.searchbox input {
  width: auto;
  flex: 1;
  min-width: 0;
  padding: 0;
  background: none;
  border: none;
  color: var(--text);
  font-size: 13px;
}
.searchbox input:focus { outline: none; border: none; box-shadow: none; }
.searchbox .kbd { margin-left: auto; flex: none; font-size: 11px; border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; color: var(--muted); }
.search-results {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  width: 300px;
  max-height: 60vh;
  overflow-y: auto;
  padding: 5px;
  border-radius: var(--radius-sm);
  background: var(--panel);
  border: 1px solid var(--border-card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: var(--shadow);
  z-index: 20;
}
.search-hit {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 11px;
  border-radius: 6px;
  text-decoration: none;
  color: var(--text);
}
.search-hit:hover { background: rgba(180, 140, 255, 0.12); }

/* Inline nav icons */

/* Hover label for an icon-only control: data-tip is the name the button would

/* ---- Two-column main content grid (Dashboard + Project detail) ---- */

/* ---- Projects list cards ---- */
.row-16-10 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 20px; margin-bottom: 18px; }
.project-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-bottom: 18px; }
.project-card-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }

.status-pill.ok { color: var(--ok); }
.status-pill.warn { color: var(--warn); }
.app-cards { display: flex; flex-direction: column; gap: 18px; }

.app-card > .app-card-head { cursor: pointer; user-select: none; }

summary > .chevron { flex: none; transform: rotate(-90deg); }

.tabs { display: flex; align-items: center; gap: 4px; border-top: 1px solid var(--border-soft); padding-top: 14px; }

/* ---- Copy-to-clipboard field ----
   A value xdev generated and you have to paste somewhere else: a webhook URL, a

.copy-row { display: flex; align-items: flex-start; gap: 8px; }
