# Generated by xdev — nginx in front of php-fpm for a Laravel app.
#
# Only used by the fpm server option; the Swoole stack serves HTTP itself and
# has no nginx. Kept as a file rather than inlined in the compose template so
# it can be edited on a running app without regenerating the stack.
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 100M;

    # Laravel's front controller: anything that is not a real file goes to
    # index.php with the query string preserved.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        # A slow first request after an idle period is normal here: pm=ondemand
        # forks a worker and Laravel boots from scratch. 60s is generous enough
        # that a cold start never surfaces as a 504.
        fastcgi_read_timeout 60s;
        fastcgi_buffers 8 8k;
        fastcgi_buffer_size 8k;
    }

    # Dotfiles are not served, except the ACME challenge directory.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # storage/ and vendor/ are below the docroot only by accident of layout;
    # nothing under them should ever be reachable over HTTP.
    location ~ ^/(storage/framework|vendor)/ {
        deny all;
    }
}
